<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachable Machine Pose Model</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #111827;
      color: #f9fafb;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #22c55e;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }

    #canvas {
      width: 400px;
      height: 400px;
      background: #000;
      border-radius: 12px;
      display: block;
    }

    #label-container {
      margin-top: 16px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div>Teachable Machine Pose Model</div>
  <button type="button" onclick="init()">Start</button>
  <div><canvas id="canvas"></canvas></div>
  <div id="label-container"></div>
  <div id="status" style="margin-top:12px;color:#fbbf24;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <script type="text/javascript">
    const URL = "./my-pose-model/";
    let model, webcam, ctx, labelContainer, maxPredictions;

    async function init() {
      const status = document.getElementById("status");

      try {
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          status.textContent = "En teléfono la cámara necesita HTTPS. Abre esta página con https o usa localhost en el mismo equipo.";
          return;
        }

        status.textContent = "Pidiendo permiso de cámara...";

        const previewStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        for (const track of previewStream.getTracks()) {
          track.stop();
        }

        status.textContent = "Cargando modelo...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        const flip = true;
        webcam = new tmPose.Webcam(size, size, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = size;
        canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {
          labelContainer.appendChild(document.createElement("div"));
        }

        status.textContent = "Cámara activa.";
      } catch (error) {
        console.error(error);
        const detail = error && error.message ? error.message : String(error);
        status.textContent = "No se pudo abrir la cámara: " + detail + ". Si no sale el aviso, abre los permisos del sitio y permite cámara manualmente.";
      }
    }

    window.init = init;

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);

      for (let i = 0; i < maxPredictions; i++) {
        const classPrediction = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        labelContainer.childNodes[i].innerHTML = classPrediction;
      }

      drawPose(pose);
    }

    function drawPose(pose) {
      if (webcam.canvas) {
        ctx.drawImage(webcam.canvas, 0, 0);
        if (pose) {
          const minPartConfidence = 0.5;
          tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
          tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
        }
      }
    }
  </script>
</body>
</html>
